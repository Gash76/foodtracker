<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1411">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Foodtracker</title>
<style>
/* Layout: Nährwert-Etikett als Leitmotiv. Sticky Datumsleiste oben, feste Tab-Leiste unten, Inhalt als schmale Spalte. */
:root{
  --bg:#EEF1EC; --surface:#FBFCFA; --ink:#15201A; --muted:#5E6C63; --rule:#15201A; --hair:#CBD3CB;
  --accent:#E4570F; --accent-ink:#FFFFFF; --good:#2E7D4F; --warn:#B3261E;
  --p:#2B63D1; --c:#C98A00; --f:#B83A7A; --planned:#8A978F;
  --font-head:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#161E19; --ink:#E7EEE8; --muted:#93A399; --rule:#E7EEE8; --hair:#2B3830;
    --accent:#FF7A3D; --accent-ink:#120A05; --good:#5CC285; --warn:#FF8A80;
    --p:#6C9BFF; --c:#F0B429; --f:#F27DB5; --planned:#6F7D75; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E19; --ink:#E7EEE8; --muted:#93A399; --rule:#E7EEE8; --hair:#2B3830;
  --accent:#FF7A3D; --accent-ink:#120A05; --good:#5CC285; --warn:#FF8A80;
  --p:#6C9BFF; --c:#F0B429; --f:#F27DB5; --planned:#6F7D75; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;min-width:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-head);font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0}

/* Datumsleiste */
.datebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--rule)}
.datebar .mid{flex:1;text-align:center;min-width:0}
.datebar .mid b{display:block;font-family:var(--font-head);font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.datebar .mid span{font-size:13px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border:1.5px solid var(--hair);border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface)}
.iconbtn:active{transform:scale(.96)}

/* Etikett */
.label{background:var(--surface);border:2px solid var(--rule);padding:12px 14px 10px;margin-top:16px}
.label .kcalrow{display:flex;justify-content:space-between;align-items:baseline;border-bottom:8px solid var(--rule);padding-bottom:6px;gap:12px}
.label .kcalrow h2{font-size:22px}
.label .kcalrow .big{font-family:var(--font-head);font-weight:700;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.label .sub{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.label .sub b{font-family:var(--font-num);font-weight:500}
.over{color:var(--warn)}
.good{color:var(--good)}
.macro{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair);font-size:14px}
.macro:last-child{border-bottom:0}
.macro .bar{height:10px;background:var(--hair);position:relative;overflow:hidden}
.macro .bar i{position:absolute;inset:0 auto 0 0;display:block}
.macro .val{font-family:var(--font-num);font-size:13px;white-space:nowrap}
.planned-note{font-size:13px;color:var(--muted);padding-top:6px;border-top:1px solid var(--hair)}

/* Banner / Karten */
.banner{margin-top:14px;border:1.5px dashed var(--accent);padding:10px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface)}
.banner span{font-size:14px;min-width:0}
.btn{background:var(--ink);color:var(--bg);padding:10px 14px;font-weight:600;border-radius:2px;white-space:nowrap}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
.card{background:var(--surface);border:1.5px solid var(--hair);padding:12px 14px;margin-top:14px}
.card h3{font-size:18px;margin-bottom:8px}

/* Mahlzeiten */
.meal{margin-top:22px}
.meal header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--rule);padding-bottom:4px}
.meal header h3{font-size:20px}
.meal header span{font-family:var(--font-num);font-size:13px;color:var(--muted)}
.entry{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left}
.entry .t{font-family:var(--font-num);font-size:13px;color:var(--muted)}
.entry .n{min-width:0}
.entry .n b{display:block;font-weight:600;overflow-wrap:anywhere}
.entry .n small{color:var(--muted);font-family:var(--font-num);font-size:12px}
.entry .n small.pl{display:block;margin-top:2px;font-family:var(--font-body,inherit);line-height:1.35}
#scan{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
#scan video{flex:1;min-height:0;width:100%;object-fit:cover}
#scan .scanline{position:absolute;left:12%;right:12%;top:38%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
#scan .scanbar{background:var(--surface);color:var(--ink);padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
#scan .scanbar input{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--hair);background:transparent;color:inherit;border-radius:4px}
#scan .scanbar .row{display:flex;gap:8px}
.conn input,.conn textarea{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid var(--hair);background:transparent;color:inherit;border-radius:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.cal .dh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal button{aspect-ratio:1/1.1;border:1px solid var(--hair);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;color:inherit;padding:2px;font-family:var(--font-num);cursor:pointer}
.cal button b{font-weight:500;font-size:14px}
.cal button small{font-size:10px;color:var(--muted)}
.cal button.has{border-color:var(--accent)}
.cal button.has small{color:var(--accent)}
.cal button.ok{border-color:var(--good)}
.cal button.ok small{color:var(--good)}
.cal button.over{border-color:var(--warn)}
.cal button.over small{color:var(--warn)}
.cal button.today b{text-decoration:underline}
.cal button.sel{outline:2px solid currentColor;outline-offset:1px}
#wkbox{margin-top:18px}
.prt{padding:10px 0;border-bottom:1px solid var(--hair)}
.prt-top{display:grid;grid-template-columns:1fr 84px auto;gap:6px;align-items:center;margin-bottom:6px}
.prt input{width:100%;min-width:0;font:inherit;font-size:15px;padding:8px;border:1px solid var(--hair);border-radius:6px;background:transparent;color:inherit}
.prt .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prt .g4 label{font-size:11px;color:var(--muted);display:block}
.prt .g4 input{font-family:var(--font-num);margin-top:2px;padding:6px}
.entry .k{font-family:var(--font-num);font-size:15px;text-align:right}
.entry.planned .n b,.entry.planned .k{color:var(--planned)}
.entry.planned{border-bottom-style:dashed}
.check{width:28px;height:28px;border:2px solid var(--planned);border-radius:50%;display:inline-grid;place-items:center;font-size:14px;margin-left:8px;flex:none}
.entry .k-wrap{display:flex;align-items:center}
.empty{text-align:center;color:var(--muted);padding:34px 8px;border:1.5px dashed var(--hair);margin-top:22px;background:var(--surface)}
.empty b{display:block;font-family:var(--font-head);font-size:22px;text-transform:uppercase;color:var(--ink);margin-bottom:4px}

/* Wasser */
.water{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.water .amt{font-family:var(--font-head);font-size:30px;font-weight:700}
.water .amt small{font-family:var(--font-body);font-size:14px;font-weight:400;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);padding:6px 12px;border-radius:2px;font-weight:600;background:transparent}
.chip.on{background:var(--ink);color:var(--bg)}
.wbar{height:8px;background:var(--hair);margin-top:10px;position:relative}
.wbar i{position:absolute;inset:0 auto 0 0;background:var(--p);display:block}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:2px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);
  padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-right,0px))}
.tabs button{padding:10px 2px 8px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;text-transform:uppercase;letter-spacing:.04em;min-width:0}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:26;width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:34px;line-height:1;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-top:3px solid var(--rule);max-height:92%;overflow-y:auto;overscroll-behavior:contain;
  padding:14px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-size:24px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sheet .x{width:40px;height:40px;font-size:22px}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);border:2px solid var(--ink);margin-bottom:12px}
.seg button{padding:9px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field input,.field select{background:var(--surface);border:1.5px solid var(--hair);padding:10px 10px;border-radius:2px;width:100%;min-width:0;font-size:16px}
.field textarea{background:var(--surface);border:1.5px solid var(--hair);padding:10px;border-radius:2px;width:100%;min-width:0;font-size:16px;resize:vertical;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pic{border:1.5px solid var(--ink);padding:10px 8px;text-align:center;font-weight:600;cursor:pointer;background:var(--surface);min-width:0}
.pic.on{background:var(--ink);color:var(--bg)}
.picnote{font-size:13px;color:var(--muted);margin:-4px 0 10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.syncline{margin-top:12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.syncline .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--planned);margin-right:6px}
.syncline.busy .dot{background:var(--accent)}
.busybox{border:1.5px dashed var(--accent);padding:12px;margin:8px 0 12px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.errbox{border:1.5px solid var(--warn);color:var(--warn);padding:10px 12px;margin:8px 0 12px;font-size:14px}
.kitag{display:inline-block;font-size:10px;border:1px solid var(--accent);color:var(--accent);padding:0 4px;margin-left:6px;letter-spacing:.06em;vertical-align:middle}
.totalrow{display:flex;justify-content:space-between;padding:8px 0;border-top:2px solid var(--rule);font-weight:600;margin-top:4px}
.fixrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}
.favrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left}
.favrow .nm{min-width:0}
.favrow b{font-weight:600;display:block;overflow-wrap:anywhere}
.favrow small{color:var(--muted);font-family:var(--font-num);font-size:12px}
.plus{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:50%;font-size:22px;line-height:1;display:grid;place-items:center}
.soon{display:flex;gap:8px;margin-bottom:12px}
.soon span{flex:1;border:1.5px dashed var(--hair);padding:8px;text-align:center;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--hair);color:var(--muted);padding:0 5px;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;z-index:60;font-size:14px;max-width:90%}

/* Woche */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat div{background:var(--surface);border:1.5px solid var(--hair);padding:10px}
.stat b{display:block;font-family:var(--font-head);font-size:30px;line-height:1.05}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--font-num);font-size:11px}
svg.chart .gl{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 3}
svg.chart .ax{stroke:var(--hair);stroke-width:1}
.wkchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 4px}
.wkchips button{padding:9px 0;border:1.5px solid var(--ink);font-weight:700;font-family:var(--font-head);font-size:18px;text-transform:uppercase}
.wkchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wkchips button.has::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:2px auto 0}
.lib-head{display:flex;gap:10px;align-items:center;margin-top:16px}
.lib-head input{flex:1;background:var(--surface);border:1.5px solid var(--hair);padding:10px;min-width:0;border-radius:2px}
.wkd{width:100%;text-align:left;border:1.5px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.wkd b{font-family:var(--font-head);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.wkd span{font-size:13px;color:var(--muted)}
.wkd[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wkd[aria-pressed="true"] span{color:var(--bg);opacity:.8}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
<button class="fab" id="fab" aria-label="Eintrag hinzufügen">+</button>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- Hilfen ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var MEALS=[['fruehstueck','Frühstück'],['mittag','Mittagessen'],['abend','Abendessen'],['snack','Snacks']];
var WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
var WDLONG=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
var DEF={kcal:2200,p:140,c:250,f:70,rest:2405,active:514,goalW:85,w0:99};
var FOLDER='17oHyJdv2wR_TuS6HhTTAWhksWcAl4CTv',DRIVE='Google Drive';
var CAP={sample:null,mcp:null,imgs:false};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseYmd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)}
function addDays(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function wdIdx(s){return (parseYmd(s).getDay()+6)%7}
function nowT(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0}
function r0(n){return Math.round(n)}
function r1(n){return Math.round(n*10)/10}
function fmt(n){return Math.round(n).toLocaleString('de-DE')}
function f1(n){return (Math.round(n*10)/10).toLocaleString('de-DE')}
function mealByTime(t){var h=+t.slice(0,2)+(+t.slice(3,5))/60;
  if(h>=5&&h<10.5)return 'fruehstueck';if(h>=10.5&&h<15)return 'mittag';if(h>=15&&h<17.5)return 'snack';if(h>=17.5&&h<22)return 'abend';return 'snack'}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3200)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function pname(k){return k==='d'?'Täglich':WDLONG[k]}

/* ---------- Speicher: db (privat pro Person), sonst Browser ---------- */
var Store={mode:'local',cfg:null,mem:{},pend:null,pendT:null,dirty:{},ver:{},flushT:null,flushing:false,failed:false,warned:false,
  init:function(){
    try{var c=JSON.parse(localStorage.getItem('ft-conn')||'null');if(c&&c.u&&c.t){this.cfg=c;this.mode='remote'}}catch(e){}
    try{this.dirty=JSON.parse(localStorage.getItem('ft-dirty')||'{}')}catch(e){this.dirty={}}
  },
  persistDirty:function(){try{localStorage.setItem('ft-dirty',JSON.stringify(this.dirty))}catch(e){}},
  lsGet:function(id){try{var v=localStorage.getItem('ft:'+id);return v?JSON.parse(v):null}catch(e){return null}},
  lsSet:function(id,d){try{localStorage.setItem('ft:'+id,JSON.stringify(d))}catch(e){}},
  api:async function(action,body,signal){
    var r;
    try{r=await fetch(this.cfg.u,{method:'POST',body:JSON.stringify(Object.assign({token:this.cfg.t,action:action},body||{})),redirect:'follow',signal:signal})}
    catch(e){throw {code:(e&&e.name==='AbortError')?'cancelled':'net'}}
    if(!r.ok)throw {code:'net'};
    var j;try{j=await r.json()}catch(e){throw {code:'net'}}
    if(j&&j.error==='auth')throw {code:'auth'};
    return j;
  },
  get:function(id){
    var self=this;
    if(this.mode!=='remote')return Promise.resolve(this.lsGet(id));
    if(id in this.mem)return Promise.resolve(this.mem[id]==null?null:clone(this.mem[id]));
    return new Promise(function(res){
      self.pend=self.pend||{keys:{},cbs:[]};
      self.pend.keys[id]=1;self.pend.cbs.push([id,res]);
      if(!self.pendT)self.pendT=setTimeout(function(){self.flushGet()},10);
    });
  },
  flushGet:async function(){
    var p=this.pend,self=this;this.pend=null;this.pendT=null;
    var docs=null;
    try{var r=await this.api('get',{keys:Object.keys(p.keys)});docs=r.docs||{};this.failed=false}
    catch(e){this.failed=true;this.failCode=e&&e.code}
    p.cbs.forEach(function(cb){
      var id=cb[0],val;
      if(docs){
        val=docs[id]===undefined?null:docs[id];
        if(self.dirty[id]){var l=self.lsGet(id);if(l)val=l}
        self.mem[id]=val;if(val!=null)self.lsSet(id,val);
      }else val=self.lsGet(id);

    });
  },
  save:function(id,data){
    var snap=clone(data),self=this;
    this.mem[id]=snap;this.lsSet(id,snap);
    if(this.mode!=='remote')return;
    this.dirty[id]=1;this.ver[id]=(this.ver[id]||0)+1;this.persistDirty();
    clearTimeout(this.flushT);this.flushT=setTimeout(function(){self.flush()},700);
  },
  flush:async function(){
    var self=this;
    if(this.flushing||this.mode!=='remote')return;
    var keys=Object.keys(this.dirty);if(!keys.length)return;
    this.flushing=true;
    var docs={},vers={};keys.forEach(function(k){docs[k]=self.mem[k]!==undefined?self.mem[k]:self.lsGet(k);vers[k]=self.ver[k]||0});
    var ok=false;
    try{await this.api('setMany',{docs:docs});ok=true}catch(e){this.failCode=e&&e.code}
    this.flushing=false;
    if(ok){
      keys.forEach(function(k){if((self.ver[k]||0)===vers[k])delete self.dirty[k]});this.persistDirty();this.warned=false;
      if(Object.keys(this.dirty).length)this.flush();
    }else{
      if(!this.warned){this.warned=true;toast(this.failCode==='auth'?'Zugang abgelehnt. Prüfe Mehr → Verbindung.':'Keine Verbindung. Änderungen werden später gesendet.')}
      clearTimeout(this.flushT);this.flushT=setTimeout(function(){self.flush()},20000);
    }
  },
  all:async function(){
    var out={},self=this;
    if(this.mode==='remote'){
      try{var r=await this.api('all');Object.keys(r.docs||{}).forEach(function(k){out[k]=r.docs[k]})}catch(e){}
      Object.keys(this.dirty).forEach(function(k){var l=self.lsGet(k);if(l)out[k]=l});
      if(Object.keys(out).length)return out;
    }
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('ft:')===0)out[k.slice(3)]=JSON.parse(localStorage.getItem(k))}}catch(e){}
    return out;
  }
};

  var ref=trend.filter(function(x){return x.d<=addDays(lw.d,-30)}).pop()||trend[0];
  var diff=lt.kg-ref.kg,days=Math.max(1,Math.round((parseYmd(lw.d)-parseYmd(ref.d))/864e5));
  var goal=num(S.settings.goalW);

  h+=svg+'<div class="hint">Punkte: einzelne Wägungen von deiner Garmin-Waage. Linie: Durchschnitt der letzten 7 Tage, er zeigt die Richtung ohne das tägliche Auf und Ab.</div></section>';

      var max=1280,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));

    var t=new Date(+tk.slice(0,4),+tk.slice(5,7)-1,+tk.slice(8,10),+tk.slice(11,13),+tk.slice(14,16));

function weekDates(){var t=ymd(new Date()),a=[];for(var i=13;i>=0;i--)a.push(addDays(t,-i));return a}

  });
  svg+='<line class="gl" x1="'+pl+'" x2="'+W+'" y1="'+sy(g.kcal)+'" y2="'+sy(g.kcal)+'"/><text x="'+(pl-4)+'" y="'+(sy(g.kcal)+4)+'" text-anchor="end">Ziel</text></svg>';
  h+='<section class="card"><h3>Kalorien pro Tag</h3>'+svg+'<div class="hint">Gestrichelt: dein Tagesziel. Grün: darunter, rot: darüber. Nur gegessene Einträge zählen.</div></section>';
  var gc=garminWeightCard();if(gc){h+=gc;return h}

  if(wp.length>=2){
    var mn=Math.min.apply(null,wp.map(function(o){return o.w}))-.5,mx=Math.max.apply(null,wp.map(function(o){return o.w}))+.5,H2=130;

async function weightLog(){
  var all=await Store.all(),log={};
  Object.keys(all).forEach(function(k){if(k.indexOf('d-')===0&&all[k]&&all[k].weight>0)log[k.slice(2)]=all[k].weight});
  Object.keys(S.days).forEach(function(k){var w=S.days[k]&&S.days[k].weight;if(w>0)log[k]=w;else delete log[k]});
  gWeights().forEach(function(w){log[w.d]=w.kg});
  return log;
}
function avgIntake(n){
  var t=ymd(new Date()),sum=0,c=0;
  for(var i=1;i<=n;i++){var d=S.days[addDays(t,-i)];if(!d)continue;var k=sumDay(d).kcal;if(k>0){sum+=k;c++}}
  return {avg:c?sum/c:0,days:c};
}
function dshort(s){var d=parseYmd(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()}
async function forecastHtml(date){
  var g=S.settings,gb=avgBurn(14),tdee=gb.n>=3?gb.avg:((num(g.rest)+num(g.active))||2920),goal=num(g.goalW);
  var log=await weightLog(),ks=Object.keys(log).sort(),wDate,w0;
  if(ks.length){wDate=ks[ks.length-1];w0=log[wDate]}else{wDate=ymd(new Date());w0=num(g.w0)}
  var a7=avgIntake(7),a30=avgIntake(30),use=a7.days>=3?a7:(a30.days>0?a30:null);
  var avg=use?use.avg:g.kcal,basis=use?('Ø '+fmt(avg)+' kcal ('+use.days+' erfasste Tage)'):('Ø '+fmt(avg)+' kcal (dein Tagesziel, noch keine Daten)');
  var days=Math.max(1,Math.round((parseYmd(date)-parseYmd(wDate))/864e5));
  var bal=avg-tdee,exp=w0+bal*days/7700,dev=exp-goal;
  var dl=dateLabel(date);
  var row=function(a,b){return '<div class="sub"><span>'+a+'</span><b>'+b+'</b></div>'};
  var h='<section class="card label" style="margin-top:14px"><h3>Prognose für '+esc(dl.main==='Morgen'?'Morgen':dl.main)+' ('+dshort(date)+')</h3>';
  h+=row('Ausgangsgewicht',f1(w0)+' kg <small style="font-weight:400">('+(ks.length?'am '+dshort(wDate):'Startgewicht')+')</small>');
  h+=row('Aufnahme',basis);
  h+=row('Verbrauch',fmt(tdee)+' kcal'+(gb.n>=3?' <small style="font-weight:400">(Garmin Ø '+gb.n+' Tage)</small>':''));
  h+=row('Bilanz pro Tag',(bal>0?'+':'−')+fmt(Math.abs(bal))+' kcal');
  h+=row('Erwartetes Gewicht','<span style="font-size:1.15em">'+f1(exp)+' kg</span>');
  h+=row('Zielgewicht',f1(goal)+' kg');
  h+=row('Abweichung',(dev<=0?'Ziel erreicht ('+f1(Math.abs(dev))+' kg darunter)':'+'+f1(dev)+' kg über dem Ziel'));
  if(w0>goal){
    var need=tdee-(w0-goal)*7700/days;
    h+='<div class="hint" style="margin-top:10px">'+(need<1200?'Das Zielgewicht ist bis dahin nicht realistisch erreichbar. Es würde weniger als 1.200 kcal pro Tag erfordern. Wähle ein späteres Datum.':'Um bis dahin '+f1(goal)+' kg zu erreichen, müsstest du im Schnitt etwa <b>'+fmt(need)+' kcal</b> pro Tag essen.'+(need<1500?' Das ist sehr wenig und kaum durchzuhalten.':''))+'</div>';
    if(bal<0){var dd=Math.round((w0-goal)*7700/(-bal));h+='<div class="hint" style="margin-top:6px">Bei deinem aktuellen Schnitt erreichst du das Zielgewicht etwa am <b>'+dshort(addDays(wDate,dd))+'</b>.</div>'}
    else h+='<div class="hint" style="margin-top:6px">Bei deinem aktuellen Schnitt nimmst du nicht ab.</div>';
  }
  h+='<div class="hint" style="margin-top:8px">Grobe Schätzung nach der Faustregel 7.700 kcal je kg. Wasser, Salz und schwankender Verbrauch verschieben das Gewicht.</div></section>';
  return h;
}

function partsEditor(){

function ctxParts(row){return row.dataset.ctx==='ai'?(Sh&&Sh.ai&&Sh.ai.parts):(Sh&&Sh.entry&&Sh.entry.parts)}
function aiTotals(){var t=partsTotal(Sh.ai.parts||[]),n=$('.totalrow .num');if(n)n.textContent=fmt(t.kcal)+' kcal'}

    if(Sh.editId&&Sh.mode!=='lib')h+='<button class="btn ghost" style="width:100%;margin-bottom:10px" data-act="favfromentry">Als Favorit speichern</button>';

function pickList(){
  var q=(Sh.q||'').toLowerCase();

}
function amtParse(x){var m=/^\s*(\d+(?:[.,]\d+)?)\s*(.*)$/.exec(String(x||''));return m?{n:parseFloat(m[1].replace(',','.')),u:m[2].trim().toLowerCase()}:null}
function amtRebase(val){
  var g=function(id){var n=$(id);return n?num(n.value):0};
  Sh.amtBase={m:val,kcal:g('#f-kcal'),p:g('#f-p'),c:g('#f-c'),f:g('#f-f')};

function amtChanged(el){
  var b=Sh&&Sh.amtBase;if(!b)return;
  var a=amtParse(b.m),c=amtParse(el.value);
  if(!c||!(c.n>0))return;
  if(!a||!(a.n>0)||(c.u&&a.u!==c.u)){amtRebase(el.value);return}
  var k=c.n/a.n,set=function(id,v){var n=$(id);if(n)n.value=v};
  set('#f-kcal',r0(b.kcal*k));set('#f-p',r1(b.p*k));set('#f-c',r1(b.c*k));set('#f-f',r1(b.f*k));
  if(!c.u&&a.u)el.value=String(el.value).trim()+' '+b.m.replace(/^\s*[\d.,]+\s*/,'');
}
function favUpsert(o){

  if(ex){Object.assign(ex,o);if(!o.parts)delete ex.parts;delete ex.example;return ex}

function favFromParts(parts){

}
function blankEntry(){var t=nowT();return {name:'',kcal:'',p:'',c:'',f:'',time:t,meal:mealByTime(t)}}
function newItemFrom(lib,mult){
  mult=mult||1;
  var o={name:lib.name,kcal:r0(lib.kcal*mult),p:r1(lib.p*mult),c:r1(lib.c*mult),f:r1(lib.f*mult)};
  if(lib.parts&&lib.parts.length){o.parts=clone(lib.parts);o.ai=true}else o.m=lib.unit||'1 Portion';
  return o;

async function commitAdd(base,time,meal,fromLib){
  var item=Object.assign({id:uid(),time:time,meal:meal},base);
  if(Sh&&Sh.mode==='plan'){
    var arr=S.plan.days[S.planDay]||(S.plan.days[S.planDay]=[]);

function readForm(){

function partsMatch(parts,v){
  if(!parts||!parts.length)return false;var t=partsTotal(parts);
  return Math.abs(t.kcal-v.kcal)<1&&Math.abs(t.p-v.p)<.15&&Math.abs(t.c-v.c)<.15&&Math.abs(t.f-v.f)<.15;
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',async function(ev){
  var el=ev.target.closest('[data-tab],[data-nav],[data-act],[data-edit],[data-done],[data-close],[data-step],[data-pick],[data-quick],[data-pd],[data-cpt],[data-pedit],[data-libedit],[data-aidel],[data-pdel],[data-padd],[data-cal],[data-calnav],#fab');
  if(!el)return;
  if(el.id==='fab'){
    if(S.tab==='essen')return openSheet({mode:'lib',step:'form',entry:{name:'',unit:'1 Portion',kcal:'',p:'',c:'',f:''}});
    if(S.tab==='plan')return openSheet({mode:'plan',step:canAi()?'ai':'pick',q:'',ai:newAi()});
    return openSheet({mode:'log',step:canAi()?'ai':'pick',q:'',ai:newAi()});
  }
  var D=el.dataset;
  if(D.tab){S.tab=D.tab;closeSheet();render();window.scrollTo(0,0);return}
  if(D.nav!==undefined){
    S.date=D.nav==='today'?ymd(new Date()):addDays(S.date,+D.nav);
    await loadDay(S.date);render();return;
  }
  if(D.close!==undefined){closeSheet();return}
  if(D.calnav!==undefined){
    var cm=S.calM||ymd(new Date()).slice(0,7),cy=+cm.slice(0,4),cmo=+cm.slice(5,7)+(+D.calnav);
    if(D.calnav==='0'){S.calM=ymd(new Date()).slice(0,7)}else{var nd=new Date(cy,cmo-1,1);S.calM=nd.getFullYear()+'-'+pad(nd.getMonth()+1)}
    renderWoche();return;
  }
  if(D.cal&&D.cal>ymd(new Date())){S.calSel=D.cal;renderWoche();return}
  if(D.cal){S.calSel=null;S.date=D.cal;S.tab='heute';await loadDay(S.date);closeSheet();render();window.scrollTo(0,0);return}
  if(D.done){var d2=dayDoc(S.date);d2.entries.forEach(function(e){if(e.id===D.done)e.done=true});saveDay(S.date);render();ev.stopPropagation();return}
  if(D.edit){
    var en=dayDoc(S.date).entries.filter(function(e){return e.id===D.edit})[0];if(!en)return;
    openSheet({mode:'log',step:'form',editId:en.id,entry:clone(en)});return;
  }
  if(D.pedit){
    var pe=(S.plan.days[S.planDay]||[]).filter(function(e){return e.id===D.pedit})[0];if(!pe)return;
    openSheet({mode:'plan',step:'form',editId:pe.id,entry:clone(pe)});return;
  }
  if(D.libedit){
    var li=S.library.items.filter(function(e){return e.id===D.libedit})[0];if(!li)return;
    openSheet({mode:'lib',step:'form',editId:li.id,entry:clone(li)});return;
  }
  if(D.pd!==undefined){S.planDay=D.pd==='d'?'d':+D.pd;S.cpTo=[];renderPlan();return}
  if(D.cpt!==undefined){var ci=+D.cpt;S.cpTo=S.cpTo||[];var ix=S.cpTo.indexOf(ci);if(ix>=0)S.cpTo.splice(ix,1);else S.cpTo.push(ci);renderPlan();return}
  if(D.step){
    if(Sh.step==='form'&&D.step!=='form'){}
    Sh.step=D.step;
    if(D.step==='ai'&&!Sh.ai)Sh.ai=newAi();
    if(D.step==='form'){Sh.base=null;if(!Sh.entry||!Sh.entry.time)Sh.entry=blankEntry()}
    drawSheet();return;
  }
  if(D.pdel!==undefined||D.padd!==undefined){
    var v1=readForm();Object.assign(Sh.entry,{name:v1.name,time:v1.time||Sh.entry.time,meal:v1.meal||Sh.entry.meal});
    if(!Sh.entry.parts)Sh.entry.parts=[];
    var oldNm=partsName(Sh.entry.parts);
    if(D.pdel!==undefined)Sh.entry.parts.splice(+D.pdel,1);else Sh.entry.parts.push({n:'Neuer Posten',m:'',kcal:0,p:0,c:0,f:0});
    var tt0=partsTotal(Sh.entry.parts);
    Object.assign(Sh.entry,{kcal:r0(tt0.kcal),p:r1(tt0.p),c:r1(tt0.c),f:r1(tt0.f)});
    if(v1.name===oldNm&&Sh.entry.parts.length)Sh.entry.name=partsName(Sh.entry.parts);
    drawSheet();return;
  }
  if(D.aidel!==undefined){Sh.ai.parts.splice(+D.aidel,1);drawSheet();return}
  if(D.pick){
    var lib=S.library.items.filter(function(i){return i.id===D.pick})[0];if(!lib)return;
    var t=nowT();
    Sh.step='form';Sh.base=lib;Sh.entry=Object.assign({time:t,meal:mealByTime(t)},newItemFrom(lib,1));
    drawSheet();
    return;
  }

function saveFile(name,text,type){
  try{
    var b=new Blob([text],{type:type+';charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
  }catch(e){toast('Speichern nicht möglich')}
}
function parseConn(txt){
  try{
    var t=String(txt||'').trim();var m=/c=([A-Za-z0-9_\-]+)/.exec(t);if(m)t=m[1];
    t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';
    var bin=atob(t),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var d=new TextDecoder('utf-8').decode(u).split('|');
    if(d.length===2&&/^https:\/\/script\.google\.com\//.test(d[0])&&d[1].length>=20)return {u:d[0],t:d[1]};
  }catch(e){}
  return null;
}

/* ---------- Barcode-Scanner (Kamera + Open Food Facts) ---------- */
var Scan={stream:null,timer:null,det:null,busy:false};
async function startScan(){
  if(document.getElementById('scan'))return;
  var ov=document.createElement('div');ov.id='scan';
  ov.innerHTML='<video id="scanv" playsinline muted autoplay></video><div class="scanline"></div><div class="scanbar"><span id="scanmsg" class="hint">Halte den Strichcode ins Bild.</span><input id="scanman" inputmode="numeric" placeholder="oder Nummer unter dem Strichcode eintippen"><div class="row"><button class="btn accent" data-act="scanok" style="flex:1">Nummer suchen</button><button class="btn ghost" data-act="scanstop" style="flex:1">Abbrechen</button></div></div>';
  document.body.appendChild(ov);
  var msg=function(t){var m=document.getElementById('scanmsg');if(m)m.textContent=t};
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Dieser Browser kann Strichcodes nicht lesen. Tippe die Nummer ein.');return}
  try{
    Scan.det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
    Scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    var v=document.getElementById('scanv');if(!v){stopScan();return}
    v.srcObject=Scan.stream;await v.play();
    Scan.timer=setInterval(async function(){
      if(Scan.busy||!document.getElementById('scanv'))return;Scan.busy=true;
      try{var r=await Scan.det.detect(v);if(r&&r.length&&r[0].rawValue){onCode(r[0].rawValue)}}catch(e){}
      Scan.busy=false;
    },300);
  }catch(e){msg('Kamera nicht verfügbar. Erlaube den Zugriff oder tippe die Nummer ein.')}
}
function stopScan(){
  clearInterval(Scan.timer);Scan.timer=null;
  if(Scan.stream){try{Scan.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}Scan.stream=null}
  var ov=document.getElementById('scan');if(ov)ov.remove();
}
async function onCode(code){
  code=String(code||'').replace(/\D/g,'');if(code.length<6)return;
  var m=document.getElementById('scanmsg');if(m)m.textContent='Suche '+code+' …';
  clearInterval(Scan.timer);Scan.timer=null;
  var p=null;
  try{p=await lookupEan(code)}catch(e){stopScan();toast('Keine Verbindung zur Produktdatenbank');return}
  stopScan();
  if(!p){toast('Produkt '+code+' nicht gefunden. Nutze das Etikett-Foto.');return}
  if(!Sh||!Sh.ai)return;
  Sh.ai.parts=[p];Sh.ai.note='Nährwerte aus Open Food Facts (Strichcode '+code+'). Passe die Menge an.';Sh.ai.err='';
  drawSheet();
}
async function lookupEan(code){
  var r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity,quantity');
  var j=await r.json();
  if(!j||j.status!==1||!j.product)return null;
  var pr=j.product,n=pr.nutriments||{};
  var kcal=num(n['energy-kcal_100g']);if(!kcal&&n['energy_100g'])kcal=num(n['energy_100g'])/4.184;
  var p100=num(n['proteins_100g']),c100=num(n['carbohydrates_100g']),f100=num(n['fat_100g']);
  if(!kcal&&!p100&&!c100&&!f100)return null;
  var amt=num(pr.serving_quantity)>0?num(pr.serving_quantity):100,k=amt/100;
  var nm=(pr.product_name_de||pr.product_name||'Produkt');if(pr.brands)nm+=' ('+String(pr.brands).split(',')[0].trim()+')';
  return {n:nm.slice(0,80),m:Math.round(amt)+' g',kcal:r0(kcal*k),p:r1(p100*k),c:r1(c100*k),f:r1(f100*k)};
}

/* ---------- Start ---------- */
function initCaps(){
  var h=location.hash||'';
  if(/^#c=/.test(h)){
    var cc=parseConn(h.slice(1));
    if(cc){try{localStorage.setItem('ft-conn',JSON.stringify(cc))}catch(e){}}
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
  }
  Store.init();
  if(Store.mode==='remote'){CAP.sample=true;CAP.mcp=true;CAP.imgs=true}
}
async function boot(){
  render0();
  initCaps();
  var pre=[Store.get('settings'),Store.get('library'),Store.get('plan'),Store.get('drive'),Store.get('d-'+S.date),Store.get('garmin')];
  var res=await Promise.all(pre.slice(0,4));
  try{var gg=await pre[5];if(gg&&gg.days)S.garmin=gg}catch(e){}
  if(Store.mode==='remote'&&Store.failed&&!res[0]){
    $('#app').innerHTML='<div class="empty"><b>Keine Verbindung</b>'+(Store.failCode==='auth'?'Der Zugang wurde abgelehnt. Prüfe die Verbindung unter Mehr.':'Der Server ist gerade nicht erreichbar.')+'<br><button class="btn accent" style="margin-top:12px" id="retry">Erneut versuchen</button> <button class="btn ghost" style="margin-top:12px" data-tab="mehr">Mehr</button></div>';
    $('#retry').onclick=function(){location.reload()};
    return;
  }
  S.settings=Object.assign({},DEF,res[0]||{});delete S.settings.water;
  if(!res[0])saveSettings();
  S.library=res[1]||{items:SEED.map(function(s){return Object.assign({id:uid(),lastUsed:'',example:true},s)})};
  if(!res[1])saveLibrary();
  S.plan=res[2]||{days:{}};if(!S.plan.days)S.plan.days={};
  S.drive=res[3]||{done:{}};if(!S.drive.done)S.drive.done={};
  await loadDay(S.date);
  render();
  if(Store.mode==='remote'){syncDrive();Store.flush()}
  else{toast('Nicht verbunden: Verbindungscode unter Mehr einfügen')}
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&Store.mode==='remote'){Store.flush();syncDrive();loadGarmin().then(function(ok){if(ok&&S.tab==='heute'&&!Sh)render()})}
  });
  window.addEventListener('online',function(){Store.flush();syncDrive()});
  if('serviceWorker' in navigator){
    var had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!Sh)location.reload()});
    navigator.serviceWorker.register('sw.js').then(function(reg){
      var chk=function(){try{reg.update()}catch(e){}};
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')chk()});
      chk();
    }).catch(function(){});
  }
}
function render0(){S.settings=Object.assign({},DEF);S.library={items:[]};S.plan={days:{}};renderTabs();$('#app').innerHTML='<div class="empty">Lade …</div>'}
boot();
})();
